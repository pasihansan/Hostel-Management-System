name: Sync Fork

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/ORIGINAL_OWNER/REPO_NAME.git
          git fetch upstream
          git checkout main
          git merge upstream/main
          git push origin main
